<!-- Header -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Django Blogs</title>

    <!-- Bootstrap -->
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="blog-header py-3">

        <div class="row flex-nowrap justify-content-between align-items-center">

            <div class="col-4 pt-1">
                <a class="blog-header-logo text-dark" href="/">
                    Django Blog
                </a>
            </div>

            <div class="col-4">
                <!-- Search -->
                <div class="p-3 mb-3 bg-light rounded">
                    <form action="{% url 'search' %}" method="GET">

                        <div class="input-group">

                            <input type="text" name="keyword"
                               value = "{{ keyword }}" 
                               class="form-control" 
                                placeholder="Search posts...">

                            <div class="input-group-append">
                                <button class="btn btn-dark" type="submit">
                                    Search
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-4 d-flex justify-content-end align-items-center">

                {% if not user.is_authenticated %}
                <a class="btn btn-sm btn-warning" href="{% url 'login' %}">
                    Login
                </a>

                &nbsp;

                <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">
                    Register
                </a>
                {% else %}
                <a class="btn btn-sm btn-warning" href="{% url 'dashboard' %}">
                    Dashboard
                </a>
                &emsp;
                <a class="btn btn-sm btn-warning" href="{% url 'logout' %}">
                    Logout
                </a>
                {% endif %}
            </div>

        </div>

    </header>


    <!-- Categories -->
    <div class="nav-scroller py-1 mb-3">

        <nav class="nav d-flex justify-content-between">
            {% for cat in categories %}
            <a class="p-2 text-muted"  href="{% url 'posts_by_category' cat.id %}">{{ cat.category_name }}</a>
            {% endfor %}
        </nav>

    </div>

<!-- Main  -->

{% block content %}

{% endblock %}

<!-- footer -->
<footer class="blog-footer">

    <p>
        Django Blog built with ❤️ using Django & Bootstrap
    </p>

</footer>


</body>
</html>
