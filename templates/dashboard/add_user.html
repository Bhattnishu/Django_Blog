{% extends 'base.html' %} 
 
{% block content %} 
{% load crispy_forms_tags %}
<div class="row">
    <!-- Left sidebar  -->
    {% include 'dashboard/sidebar.html' %}
    <!-- Right sidebar -->
    <div class="col-md-9">
        {% if perms.auth.add_user %}
        <h2>Add New Usert</h2>
        <form action="{% url 'add_user' %}" method="POST">
            {% csrf_token %}
            {{ form | crispy}}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>
        {% else %}
        <h3>No can not see this page</h3>
        {% endif %}
    </div>
</div>

{% endblock %}
