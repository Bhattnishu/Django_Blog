{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body">

                    <h3 class="mb-4">
                        Edit Comment
                    </h3>

                    <form method="POST">

                        {% csrf_token %}

                        <textarea
                            name="comment"
                            class="form-control"
                            rows="5"
                            required
                        >{{ comment.comment }}</textarea>

                        <button
                            type="submit"
                            class="btn btn-success mt-2"
                        >
                            Update Comment
                        </button>

                        <a
                            href="{% url 'blogs' comment.blog.slug %}"
                            class="btn btn-secondary mt-2"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
